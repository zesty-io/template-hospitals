<script src="https://cdn.tailwindcss.com"></script>
<section class="bg-[#F7F4EE] py-24">
  <div class="max-w-[1200px] mx-auto px-8 grid gap-16 items-center" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div>
      <div class="text-xs tracking-[.14em] uppercase text-brand-2 font-semibold mb-3.5">{{this.about_preview_eyebrow}}</div>
      <h2 class="font-serif font-normal text-[clamp(30px,3.4vw,42px)] leading-tight tracking-tight mb-5">{{this.about_preview_headline}}</h2>
      <p class="text-[16.5px] leading-relaxed text-[#4A5957] mb-4">{{this.about_preview_body1}}</p>
      <p class="text-[16.5px] leading-relaxed text-[#4A5957] mb-7">{{this.about_preview_body2}}</p>
      <a href="/about" class="inline-block px-7 py-3.5 border border-[#12211F] rounded-lg text-[15px] font-semibold text-[#12211F] hover:bg-[#12211F] hover:text-white">Read more about us</a>
    </div>
    <div class="h-[440px] relative rounded-[18px] overflow-hidden">
      <img src="{{this.about_preview_image.getImage()}}" alt="{{this.about_preview_headline}}" class="w-full h-full object-cover" />
    </div>
  </div>
</section>
