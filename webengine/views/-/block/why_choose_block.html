<script src="https://cdn.tailwindcss.com"></script>
<section class="py-24">
  <div class="max-w-[1200px] mx-auto px-8">
    <h2 class="font-serif font-normal text-[clamp(30px,3.4vw,42px)] leading-tight tracking-tight mb-12 max-w-[520px]">{{this.headline}}</h2>
    <div class="grid gap-10" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
      {{if {features} != ''}}
        {{each {features} as f}}
        <div class="border-t-2 border-[#12211F] pt-5.5">
          <svg class="mt-3.5 mb-3.5" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B5D57" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.icon_path}}" /></svg>
          <h3 class="font-serif font-normal text-[22px] leading-snug mt-4.5 mb-2.5">{{f.title}}</h3>
          <p class="text-[14.5px] leading-relaxed text-[#5B6B69]">{{f.body}}</p>
        </div>
        {{/each}}
      {{/if}}
    </div>
  </div>
</section>
